<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyom Nyom Cakes | Кейс</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .case-page { padding: 40px 24px; max-width: 900px; margin: 0 auto; }
    .back-link { display: inline-block; margin-bottom: 20px; color: var(--text-muted); text-decoration: none; }
    .case-header { margin-bottom: 40px; }
    .case-title { font-size: 3rem; margin-bottom: 10px; }
    .case-subtitle { color: var(--text-muted); font-size: 1.5rem; }
    .case-block { margin-bottom: 40px; }
    .case-block img { width: 100%; border-radius: var(--radius-lg); }
    .footer-nav { margin-top: 60px; text-align: center; }
  </style>
</head>
<body>
  <main class="case-page">
    <a href="index.html" class="back-link">← На главную</a>
    
    <header class="case-header">
      <h1 class="case-title">Nyom Nyom Cakes</h1>
      <p class="case-subtitle">E-commerce Web Design & UI Kit</p>
    </header>

    <div class="case-block">
      <img src="assets/nyom-nyom/main-cover.jpg" alt="Обложка">
    </div>

    <div class="case-block">
      <h2>Задача и стек</h2>
      <p>Инструменты: Figma, 12-column grid.<br>
      Задача: Проектирование каталога и UI Kit.</p>
    </div>

    <div class="case-block">
      <h2>Сетка и вайрфрейм</h2>
      <img src="assets/nyom-nyom/ux.jpg" alt="UX">
    </div>

    <div class="case-block">
      <h2>Дизайн-система</h2>
      <img src="assets/nyom-nyom/ui-kit.jpg" alt="UI Kit">
    </div>

    <div class="case-block">
      <h2>Финальный макет</h2>
      <img src="assets/nyom-nyom/final.jpg" alt="Финальный макет">
    </div>

    <footer class="footer-nav">
      <a href="barbershop.html" class="btn-case">Следующий проект: Барбершоп →</a>
    </footer>
  </main>
</body>
</html>
